<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinova Gemini UI</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ROS Web Tools -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen flex flex-col overflow-hidden p-4 gap-4">

    <!-- Header (Fixed Height, Shrink-0) -->
    <header class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border-b-2 border-gray-200 shrink-0">
        <div class="flex items-center gap-4">
            <div class="bg-gray-900 text-white p-2 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-black text-gray-900 uppercase tracking-tighter">Kinova-Gemini <span class="text-blue-600">Command Center</span></h1>
                <div id="connection-status" class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-red-100 text-red-600 uppercase tracking-widest animate-pulse">Disconnected</div>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <button id="estop-btn" class="bg-red-600 hover:bg-red-700 text-white font-black py-3 px-8 rounded-md text-sm uppercase tracking-widest transition-all duration-150 shadow-lg border-b-4 border-red-900 active:border-b-0 active:translate-y-1">
                Emergency stop
            </button>
        </div>
    </header>

    <!-- Main Workspace (Flex-Grow, Grid, Min-H-0 to Prevent Overflow) -->
    <main class="flex-grow grid grid-cols-2 gap-4 min-h-0 overflow-hidden">
        
        <!-- LEFT PANEL: Gemini Chat (Unified texting interface) -->
        <div class="bg-white rounded-lg shadow-md flex flex-col h-full border-t-4 border-purple-500 overflow-hidden">
            <!-- Chat Header -->
            <div class="p-3 border-b border-gray-100 bg-gray-50 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fas fa-brain text-purple-500 text-xs"></i>
                    <h2 class="text-xs font-black uppercase tracking-[0.2em] text-gray-500">Gemini Chat</h2>
                </div>
                <span class="flex h-2 w-2 rounded-full bg-purple-400 animate-pulse"></span>
            </div>
            
            <!-- Chat Message Bubble Container -->
            <div id="chat-container" class="flex-grow bg-gray-50 p-4 overflow-y-auto space-y-4 leading-relaxed flex flex-col">
                <div class="text-gray-400 italic text-[10px] text-center uppercase tracking-widest py-2 border-b border-gray-100 mb-2 shrink-0">Neural bridge active</div>
            </div>

            <!-- Chat Form Box (Embedded at the bottom of Chat Column) -->
            <div class="p-3 border-t border-gray-100 bg-white shrink-0">
                <!-- Voice is the primary input, so mic state is always visible rather than
                     hidden until something happens. Driven by /voice_status. -->
                <div id="voice-status-indicator" class="mb-2 flex items-center gap-1 bg-gray-50 p-2 rounded text-gray-600 font-bold text-[10px] uppercase tracking-widest">
                    <span id="voice-status-dot" class="inline-block w-2 h-2 rounded-full mr-2 bg-gray-300"></span>
                    <span id="voice-status-text">Connecting…</span>
                </div>
                <form id="command-form" class="relative flex gap-2">
                    <div class="relative flex-grow">
                        <input type="text" id="command-input" autocomplete="off" placeholder="Or type a command (voice is primary)"
                            class="w-full p-3 pr-12 border-2 border-gray-100 rounded-lg focus:outline-none focus:border-blue-500 bg-gray-50 text-sm font-medium transition-all duration-200 placeholder:text-gray-400">
                        <button type="button" id="voice-btn" title="Hold to talk" class="absolute right-2 top-2 bottom-2 text-gray-400 hover:text-blue-600 transition-colors duration-150 px-2 select-none touch-none">
                            <i class="fas fa-microphone text-lg"></i>
                        </button>
                    </div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-black px-6 rounded-lg transition-all duration-150 shadow-md uppercase text-xs tracking-widest shrink-0">
                        Send
                    </button>
                </form>
            </div>
        </div>

        <!-- RIGHT PANEL: Full-Height Camera Feed -->
        <div class="bg-white p-2 rounded-lg shadow-md border-t-4 border-gray-900 flex flex-col h-full overflow-hidden">
            <div class="px-3 py-1 flex justify-between items-center mb-1 shrink-0">
                <h2 class="text-xs font-black uppercase tracking-[0.2em] text-gray-500">Camera Stream</h2>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-green-600 uppercase">Live</span>
                    <span class="h-2 w-2 rounded-full bg-green-500"></span>
                </div>
            </div>
            <div class="flex-grow bg-black rounded-md overflow-hidden flex items-center justify-center border border-gray-200">
                <img id="video-stream" src="http://localhost:8080/stream?topic=/camera/realsense/color/image_raw&type=mjpeg" alt="Camera Feed Link" class="w-full h-full object-contain">
            </div>
        </div>

    </main>

    <!-- BOTTOM PANEL: Simplified Robot State (Horizontal Strip, Shrink-0) -->
    <footer class="bg-white p-3 rounded-lg shadow-md border-t-4 border-blue-500 flex justify-between items-center gap-4 shrink-0">
        <div class="flex items-center gap-2 shrink-0 border-r border-gray-200 pr-4">
            <div class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-[10px] font-black uppercase tracking-wider">Robot State</div>
        </div>
        
        <div class="flex flex-grow justify-around items-center gap-6">
            <!-- End Effector Position (XYZ) -->
            <div class="flex flex-col">
                <span class="text-gray-400 font-bold uppercase text-[9px] tracking-widest leading-none mb-1">End Effector Pose (XYZ)</span>
                <span id="state-position" class="font-mono text-sm font-bold text-gray-900">0.000, 0.000, 0.000</span>
            </div>

            <!-- Gripper Closure & Bar -->
            <div class="flex flex-col flex-grow max-w-[300px]">
                <span class="text-gray-400 font-bold uppercase text-[9px] tracking-widest leading-none mb-1">Gripper State</span>
                <div class="relative w-full bg-blue-100 h-5 rounded-md overflow-hidden flex items-center border border-blue-200">
                    <div id="gripper-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
                    <span id="state-gripper" class="absolute inset-0 flex items-center justify-center font-mono font-black text-[10px] text-blue-900">0.0%</span>
                </div>
            </div>

            <!-- Motion Status Indicator -->
            <div class="flex flex-col items-center">
                <span class="text-gray-400 font-bold uppercase text-[9px] tracking-widest leading-none mb-1">Status</span>
                <span id="state-moving" class="px-3 py-1 rounded font-black uppercase text-[10px] tracking-wider bg-green-100 text-green-800">Stationary</span>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
